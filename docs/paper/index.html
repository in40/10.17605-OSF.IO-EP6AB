<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SymFw — Results Viewer</title>
<script src="./marked.min.js"></script>
<style>
  :root{
    --bg:#0f1117; --panel:#161a22; --panel2:#1c212c; --border:#2a3140;
    --text:#d7dce4; --muted:#8b95a7; --accent:#5aa9ff; --accent2:#7ee0c0;
    --code:#0b0d12; --pass:#5fd08a; --fail:#ff7b7b; --warn:#ffcf6b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .app{display:grid;grid-template-columns:300px 1fr;height:100vh}
  /* Sidebar */
  .side{background:var(--panel);border-right:1px solid var(--border);overflow-y:auto;padding:18px 14px}
  .brand{font-weight:700;font-size:16px;letter-spacing:.3px;margin:4px 6px 2px}
  .brand .sub{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:4px}
  .grp{margin-top:18px}
  .grp h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 6px 6px}
  .nav{display:block;padding:7px 10px;border-radius:8px;color:var(--text);font-size:13.5px;cursor:pointer;border:1px solid transparent}
  .nav:hover{background:var(--panel2);text-decoration:none}
  .nav.active{background:var(--panel2);border-color:var(--border);color:#fff}
  .nav .d{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
  /* Content */
  .main{overflow-y:auto;padding:34px 44px 80px}
  .wrap{max-width:860px;margin:0 auto}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;color:var(--muted);font-size:12.5px}
  .toolbar .pill{background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:3px 10px}
  .content h1{font-size:27px;line-height:1.25;margin:0 0 14px;border-bottom:1px solid var(--border);padding-bottom:12px}
  .content h2{font-size:21px;margin:30px 0 10px;color:#fff}
  .content h3{font-size:17px;margin:22px 0 8px;color:#e8ecf3}
  .content p{margin:10px 0}
  .content ul,.content ol{margin:10px 0 10px 4px;padding-left:22px}
  .content li{margin:4px 0}
  .content code{background:var(--code);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font:13px/1.5 "SF Mono",Menlo,Consolas,monospace;color:#cfe3ff}
  .content pre{background:var(--code);border:1px solid var(--border);border-radius:10px;padding:14px 16px;overflow:auto}
  .content pre code{background:none;border:none;padding:0;color:#cfe3ff}
  .content blockquote{border-left:3px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--panel2);color:var(--muted);border-radius:0 8px 8px 0}
  .content table{border-collapse:collapse;width:100%;margin:14px 0;font-size:13.5px}
  .content th,.content td{border:1px solid var(--border);padding:7px 10px;text-align:left}
  .content th{background:var(--panel2);color:#fff}
  .content tr:nth-child(even) td{background:#12151d}
  .content hr{border:none;border-top:1px solid var(--border);margin:26px 0}
  .content strong{color:#fff}
  .loading,.err{color:var(--muted);padding:40px 0}
  .err{color:var(--fail)}
  .tag-pass{color:var(--pass);font-weight:700}
  .tag-fail{color:var(--fail);font-weight:700}
  .tag-warn{color:var(--warn);font-weight:700}
  @media(max-width:820px){.app{grid-template-columns:1fr}.side{max-height:42vh}.main{padding:20px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">SymFw · Results Viewer
      <span class="sub">Activation-delta override detection · OSF ep6ab</span>
    </div>
    <nav id="nav"></nav>
  </aside>
  <main class="main">
    <div class="wrap">
      <div class="toolbar">
        <span class="pill" id="curfile">—</span>
        <span id="curtitle"></span>
        <span style="flex:1"></span>
        <a id="rawlink" href="#" target="_blank">raw ↗</a>
      </div>
      <div id="content" class="content"><div class="loading">Loading…</div></div>
    </div>
  </main>
</div>
<script>
const DOCS = [
  {group:"Paper", items:[
    {file:"paper/RESULTS.md", title:"Full Results", desc:"Complete write-up (EN)"},
    {file:"paper/ABSTRACT.md", title:"Abstract", desc:"~230-word submission abstract"},
    {file:"paper/RESULTS_RU.md", title:"Результаты (RU)", desc:"Русская версия для команды"},
    {file:"paper/RELATED_WORK_VS_RESULT.md", title:"Related Work", desc:"Сверка с 12 цитатами"},
    {file:"paper/SLIDES_OUTLINE.md", title:"Slides Outline", desc:"15 слайдов + backup"},
    {file:"paper/TABLES.tex", title:"LaTeX Tables", desc:"booktabs tables (.tex)"},
  ]},
  {group:"Preregistration", items:[
    {file:"PREREG_OSF_FULL.md", title:"Prereg (full)", desc:"OSF v17 full text"},
    {file:"REVIEWER_COVER_NOTE.md", title:"Cover Note", desc:"Reviewer cover note"},
    {file:"PRIOR_WORK_POSITIONING.md", title:"Prior Work", desc:"Novelty positioning"},
    {file:"OSF_FORM_FILL_GUIDE.md", title:"Form Guide", desc:"OSF fill guide"},
  ]},
  {group:"Engineering", items:[
    {file:"SESSION_SUMMARY.md", title:"Session Summary", desc:"Full project state"},
    {file:"PROBE_DESIGN.md", title:"Probe Design", desc:"Probe architecture"},
    {file:"EXPERIMENT_MODEL.md", title:"Experiment Model", desc:"Model/experiment"},
  ]},
];

const nav = document.getElementById('nav');
const content = document.getElementById('content');
let current = null;

DOCS.forEach(g=>{
  const d=document.createElement('div'); d.className='grp';
  const h=document.createElement('h3'); h.textContent=g.group; d.appendChild(h);
  g.items.forEach(it=>{
    const a=document.createElement('a'); a.className='nav'; a.href='#'+it.file;
    a.innerHTML = it.title + '<span class="d">'+it.desc+'</span>';
    a.dataset.file=it.file;
    a.addEventListener('click', e=>{ e.preventDefault(); load(it); });
    d.appendChild(a);
  });
  nav.appendChild(d);
});

function setActive(file){
  document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active', n.dataset.file===file));
}

function colorTags(html){
  return html
    .replace(/(\bPASS\b|SUPPORTED|✅[^\s]*)/g,'<span class="tag-pass">$1</span>')
    .replace(/(\bFAIL\b|❌[^\s]*)/g,'<span class="tag-fail">$1</span>')
    .replace(/(\bMARGINAL\b|near-miss|⚠️[^\s]*)/g,'<span class="tag-warn">$1</span>');
}

async function load(it){
  current = it.file;
  setActive(it.file);
  history.replaceState(null,'','#'+it.file);
  document.getElementById('curfile').textContent = it.file;
  document.getElementById('curtitle').textContent = it.title;
  const raw = document.getElementById('rawlink'); raw.href = './'+it.file;
  content.innerHTML = '<div class="loading">Loading '+it.file+'…</div>';
  try{
    const res = await fetch('./'+it.file, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const text = await res.text();
    if(it.file.endsWith('.tex')){
      content.innerHTML = '<h1>'+it.title+'</h1><pre><code>'+escapeHtml(text)+'</code></pre>';
    } else {
      let html = marked.parse(text, {mangle:false, headerIds:true});
      html = colorTags(html);
      content.innerHTML = html;
    }
    document.querySelector('.main').scrollTop=0;
  }catch(e){
    content.innerHTML = '<div class="err">Could not load '+it.file+': '+e.message+
      '<br><br>Is the file present in the docs share?</div>';
  }
}
function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

// initial route
const hash = location.hash.replace(/^#/,'');
const found = DOCS.flatMap(g=>g.items).find(i=>i.file===hash);
load(found || DOCS[0].items[0]);
</script>
</body>
</html>
